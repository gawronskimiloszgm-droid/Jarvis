<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>Zaznacz fragment ekranu</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; cursor: crosshair; user-select: none; font-family: 'Segoe UI', system-ui, sans-serif; }
  #shot { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: fill; }
  #dim { position: fixed; inset: 0; background: rgba(0, 8, 12, .45); }
  #sel { position: fixed; display: none; border: 1.5px solid #33e0ff; box-shadow: 0 0 0 9999px rgba(0, 8, 12, .45), 0 0 18px rgba(51, 224, 255, .5); }
  #hint { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); padding: 8px 16px; border: 1px solid rgba(51, 224, 255, .5); border-radius: 999px; background: rgba(3, 12, 16, .9); color: #cdeef7; font-size: 13px; letter-spacing: .04em; }
</style>
</head>
<body>
<img id="shot" alt="" />
<div id="dim"></div>
<div id="sel"></div>
<div id="hint">Zaznacz obszar mysza · Esc anuluje</div>
<script>
  const shot = document.getElementById('shot');
  const dim = document.getElementById('dim');
  const sel = document.getElementById('sel');
  let start = null;
  window.region.onImage((url) => { shot.src = url; });
  const rectOf = (a, b) => ({ x: Math.min(a.x, b.x), y: Math.min(a.y, b.y), w: Math.abs(a.x - b.x), h: Math.abs(a.y - b.y) });
  document.addEventListener('mousedown', (e) => {
    start = { x: e.clientX, y: e.clientY };
    dim.style.display = 'none';
    sel.style.display = 'block';
    Object.assign(sel.style, { left: start.x + 'px', top: start.y + 'px', width: '0px', height: '0px' });
  });
  document.addEventListener('mousemove', (e) => {
    if (!start) return;
    const r = rectOf(start, { x: e.clientX, y: e.clientY });
    Object.assign(sel.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });
  });
  document.addEventListener('mouseup', (e) => {
    if (!start) return;
    const r = rectOf(start, { x: e.clientX, y: e.clientY });
    start = null;
    window.region.done({ ...r, vw: window.innerWidth, vh: window.innerHeight });
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.region.done(null); });
</script>
</body>
</html>
