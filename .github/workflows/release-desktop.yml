name: Wydanie aplikacji desktopowej
# Tag desktop-v0.2.1 -> buduje instalator Windows i publikuje go w GitHub
# Releases. Zainstalowane aplikacje same pobiora aktualizacje (electron-updater).
on:
  push:
    tags: ['desktop-v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalacja i budowa
        working-directory: desktop
        run: |
          npm install
          npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Opublikuj wydanie (szkic -> publiczne, inaczej aplikacje nie zobacza aktualizacji)
        shell: bash
        run: |
          id=$(gh api "repos/${{ github.repository }}/releases" --jq '.[] | select(.tag_name=="${{ github.ref_name }}") | .id' | head -1)
          if [ -z "$id" ]; then echo "Nie znaleziono wydania dla ${{ github.ref_name }}"; gh api "repos/${{ github.repository }}/releases" --jq '.[] | [.tag_name, .draft] | @tsv'; exit 1; fi
          gh api -X PATCH "repos/${{ github.repository }}/releases/$id" -F draft=false --jq '.html_url'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
