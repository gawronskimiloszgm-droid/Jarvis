name: Wydanie aplikacji desktopowej
# Tag desktop-v0.6.0 -> buduje instalator Windows i publikuje go w GitHub
# Releases. Zainstalowane aplikacje same pobiora aktualizacje (electron-updater).
# Publikacja robiona jawnie (gh release create), bo electron-builder zostawial wydania jako szkice.
on:
  push:
    tags: ['desktop-v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalacja i budowa
        working-directory: desktop
        run: |
          npm install
          npx electron-builder --win --publish never
      - name: Co zbudowano
        shell: bash
        run: ls -la desktop/dist
      - name: Publikacja wydania
        shell: bash
        run: |
          set -e
          tag="${{ github.ref_name }}"
          # usun ewentualne wczesniejsze (szkice) wydania o tym tagu
          for id in $(gh api "repos/${{ github.repository }}/releases" --jq ".[] | select(.tag_name==\"$tag\") | .id"); do
            gh api -X DELETE "repos/${{ github.repository }}/releases/$id"
          done
          files=$(ls desktop/dist/*.exe desktop/dist/*.exe.blockmap desktop/dist/latest.yml)
          echo "$files"
          gh release create "$tag" $files --title "Aplikacja desktopowa ${tag#desktop-v}" --notes "Instalator J.A.R.V.I.S. dla Windows. Zainstalowane aplikacje zaktualizuja sie same." --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
