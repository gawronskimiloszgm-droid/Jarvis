<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000205">
<title>J.A.R.V.I.S. MK-X // Neural OS</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-posture="nominal">
<canvas class="bg" id="bg" aria-hidden="true"></canvas>
<div class="grid"></div><div class="scan"></div>

<div class="app">
  <header>
    <div class="sys"><span class="dot"></span><span id="status">SYSTEM NOMINAL</span></div>
    <div class="title">J.A.R.V.I.S.</div>
    <div class="clock"><span id="clock">--:--:--</span><small id="date"></small></div>
  </header>

  <main>
    <div class="col">
      <section class="pane"><h2>INTEGRALNOŚĆ SYSTEMU</h2>
        <div class="body">
          <div class="metric"><div class="row"><span>CPU</span><b id="cpuV">0%</b></div><canvas id="cpuC"></canvas></div>
          <div class="metric"><div class="row"><span>PAMIĘĆ</span><b id="memV">0 GB</b></div><div class="bar"><i id="memB"></i></div></div>
          <div class="metric"><div class="row"><span>SIEĆ</span><b id="netV">0 Mbps</b></div><canvas id="netC"></canvas></div>
          <div class="metric"><div class="row"><span>CZAS PRACY</span><b id="up">00:00</b></div></div>
        </div>
      </section>
      <section class="pane"><h2>POSTAWA</h2>
        <div class="body modes" id="modes">
          <button class="chip" data-m="nominal" aria-pressed="true">NOMINALNY</button>
          <button class="chip" data-m="focus" aria-pressed="false">SKUPIENIE</button>
          <button class="chip" data-m="threat" aria-pressed="false">ZAGROŻENIE</button>
          <button class="chip" data-m="recovery" aria-pressed="false">REGENERACJA</button>
        </div>
      </section>
    </div>

    <div class="center">
      <div class="rings" aria-hidden="true"><i></i><i></i><i></i></div>
      <canvas id="core" aria-label="Rdzeń J.A.R.V.I.S."></canvas>
      <button class="core-hit" id="coreHit" aria-label="Włącz lub wyłącz głos"></button>
      <div class="state" id="state">Gotowy, sir</div>
    </div>

    <div class="col">
      <section class="pane" style="flex:1"><h2>LOGI NEURONOWE</h2>
        <div class="body"><ul class="logs" id="logs"></ul></div>
      </section>
    </div>
  </main>

  <footer>
    <div class="console">
      <div class="feed" id="feed" aria-live="polite"></div>
      <form id="form">
        <button class="btn mic" id="mic" type="button" aria-label="Mikrofon"><span class="bars"><i></i><i></i><i></i><i></i><i></i></span></button>
        <input id="inp" placeholder="Słucham, sir… wpisz „pomoc”" autocomplete="off" aria-label="Polecenie">
        <button class="btn" type="submit">Wykonaj</button>
      </form>
      <div class="hint">pomoc · czas · skan · tryb zagrożenie · głos włącz</div>
    </div>
  </footer>
</div>

<script src="app.js"></script>
</body>
</html>
