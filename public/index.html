<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#020409" />
<title>J.A.R.V.I.S.</title>
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icons/icon-192.svg" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="scanlines"></div>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        J.A.R.V.I.S.
      </div>
      <div class="topbar-right">
        <button id="wakeBtn" class="icon-btn" title="Nasluchiwanie na slowo 'Jarvis'" aria-label="Przelacz tryb wake word">👂</button>
        <button id="notifyBtn" class="icon-btn" title="Wlacz powiadomienia" aria-label="Wlacz powiadomienia">🔔</button>
        <div id="status" class="status">INICJALIZACJA...</div>
      </div>
    </header>

    <main class="core-view">
      <div class="reactor" id="reactor">
        <div class="ring ring-outer"></div>
        <div class="ring ring-mid"></div>
        <div class="ring ring-inner"></div>
        <div class="core"></div>
        <canvas id="wave" width="360" height="360"></canvas>
      </div>
    </main>

    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="chat">💬 Czat</button>
      <button class="tab" data-tab="todos">✅ Zadania</button>
      <button class="tab" data-tab="timer">⏱ Timer</button>
      <button class="tab" data-tab="reminders">🔔 Przypomnienia</button>
    </nav>

    <section class="panel active" id="panel-chat">
      <div class="log" id="log" aria-live="polite"></div>
    </section>

    <section class="panel" id="panel-todos">
      <form class="inline-form" id="todoForm">
        <input id="todoInput" class="text-input" type="text" placeholder="Nowe zadanie..." autocomplete="off" />
        <button type="submit" class="send-btn">Dodaj</button>
      </form>
      <ul class="item-list" id="todoList"></ul>
    </section>

    <section class="panel" id="panel-timer">
      <div class="timer-box">
        <div class="timer-display" id="timerDisplay">00:00</div>
        <div class="timer-controls">
          <input id="timerMinutes" class="timer-input" type="number" min="0" max="180" value="5" aria-label="Minuty" />
          <span>min</span>
          <button id="timerStartBtn" class="send-btn">Start</button>
          <button id="timerCancelBtn" class="send-btn secondary" hidden>Anuluj</button>
        </div>
      </div>
    </section>

    <section class="panel" id="panel-reminders">
      <form class="inline-form stacked" id="reminderForm">
        <input id="reminderText" class="text-input" type="text" placeholder="Tresc przypomnienia..." autocomplete="off" />
        <input id="reminderDate" class="text-input" type="datetime-local" />
        <button type="submit" class="send-btn">Dodaj przypomnienie</button>
      </form>
      <ul class="item-list" id="reminderList"></ul>
    </section>

    <footer class="controls">
      <button id="micBtn" class="mic-btn" title="Mow do Jarvisa" aria-label="Uzyj mikrofonu">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6">
          <rect x="9" y="2" width="6" height="12" rx="3"></rect>
          <path d="M5 11a7 7 0 0 0 14 0"></path>
          <line x1="12" y1="18" x2="12" y2="22"></line>
        </svg>
      </button>
      <input id="textInput" class="text-input" type="text" placeholder="Napisz do Jarvisa..." autocomplete="off" />
      <button id="sendBtn" class="send-btn" aria-label="Wyslij">Wyslij</button>
    </footer>
  </div>

  <script src="/app.js"></script>
</body>
</html>
