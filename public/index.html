<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>J.A.R.V.I.S.</title>
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icons/icon-192.png" type="image/png" />
<link rel="stylesheet" href="/style.css" />
<link rel="stylesheet" href="/edith.css" />
</head>
<body data-posture="nominal">
  <!-- Tło kosmiczne i czarna przestrzeń -->
  <canvas class="galaxy" id="galaxyCanvas" aria-hidden="true"></canvas>

  <!-- Pasek stanu na samej górze (dyskretny HUD) -->
  <header class="jarvis-header">
    <div class="sys-status">
      <span class="dot"></span>
      <span id="idleStatus">JARVIS ONLINE</span>
    </div>
    <div class="jarvis-title">J.A.R.V.I.S.</div>
    <div class="clock-display">
      <b id="idleClock">--:--</b>
    </div>
  </header>

  <!-- Główny kinowy rdzeń holograficzny (Kula AI) -->
  <main class="core-container">
    <div class="hologram-rings" aria-hidden="true">
      <i></i><i></i><i></i><i></i>
    </div>
    <canvas id="coreCanvas"></canvas>
    <button class="core-click-area" id="coreHit" title="Kliknij, aby rozmawiać"></button>
    <div class="core-status-text" id="coreState">OCZEKIWANIE NA POLECENIE, SIR...</div>
  </main>

  <!-- Dolny kinowy interfejs rozmowy (bez paneli i docka) -->
  <footer class="interaction-bar">
    <div class="feed-container" id="talkFeed"></div>
    <form class="command-form" id="talkForm">
      <button class="mic-button" id="micBtn" type="button" title="Mikrofon">
        <span class="mic-bars"><i></i><i></i><i></i></span>
      </button>
      <input class="command-input" id="talkInput" placeholder="Słucham, sir..." autocomplete="off" />
      <button class="send-button" type="submit">Wprowadź</button>
    </form>
  </footer>

  <!-- Dyskretne toasty/powiadomienia w rogu -->
  <div class="toasts" id="toasts"></div>
</body>
<script src="/sfx.js"></script>
<script src="/app.js"></script>
</html>
